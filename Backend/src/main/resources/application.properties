spring.application.name=futbol-db-backend
server.port=${SERVER_PORT:8181}

# Base de datos (los valores reales van en variables de entorno; ver .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:futboldb}}
spring.datasource.username=${DB_USER:futboldb}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: JWT_SECRET es obligatorio (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# TheSportsDB: "123" es la clave de prueba pública; con una clave premium propia se amplían los límites
app.thesportsdb.api-key=${THESPORTSDB_API_KEY:123}
